<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthday Present</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
:root{--blue:#00629f;--ink:#24475f;--sub:#7d9bb2;--line:#dbe8f1}
*{box-sizing:border-box;margin:0}
body{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f1f8fd 0%,#fff 30%,#fff 75%,#f4f9fd 100%);min-height:100vh;overflow-x:hidden}
.en{font-family:"Cormorant Garamond",Georgia,serif;letter-spacing:.16em}
header{position:fixed;top:0;left:0;padding:22px 28px;font-size:22px;font-weight:700;text-transform:uppercase;color:var(--blue);z-index:6;letter-spacing:.14em}
#snow{position:fixed;inset:0;pointer-events:none;z-index:7}
.wrap{position:relative;z-index:1}
.deco{position:absolute;z-index:0;pointer-events:none;overflow:visible}
.frame{position:relative;z-index:1}
.frame>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
svg .fl{fill:#fff}
svg .ln{fill:none;stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(112px,16vh,150px) 16px 70px;position:relative;overflow:hidden}
.script{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(46px,9vw,92px);line-height:1.15;position:relative;z-index:1}
.date{margin-top:6px;font-size:clamp(18px,2.4vw,24px);color:var(--sub);position:relative;z-index:1}
.f1{margin-top:44px;padding:70px clamp(34px,6vw,70px) 64px;max-width:100%}
.piano{display:flex;position:relative;margin:0 auto 26px;padding:12px 12px 16px;background:#fff;border-radius:12px;box-shadow:0 10px 30px #00629f1f;width:fit-content;max-width:100%}
.w{width:clamp(34px,7.4vw,60px);height:clamp(140px,26vw,210px);background:linear-gradient(#fff,#f6fafd);border:1px solid var(--line);border-radius:0 0 8px 8px;display:block;text-decoration:none;transition:.12s;cursor:pointer}
.w:hover{background:#e8f4fc}.w:active,.w.on{transform:translateY(2px);background:#d4e9f7}
.b{position:absolute;top:12px;width:clamp(22px,4.6vw,36px);height:clamp(88px,16vw,130px);background:linear-gradient(#34607f,#1d4766);border-radius:0 0 6px 6px;z-index:2;transition:.12s;cursor:pointer}
.b:hover{background:#4a7da5}.b:active,.b.on{transform:translateY(2px)}
.title{font-size:clamp(17px,2.6vw,22px);font-weight:500;letter-spacing:.2em;color:var(--blue)}
.hint{margin-top:8px;font-size:13px;color:var(--sub);letter-spacing:.15em}
.card-sec{position:relative;padding:50px 16px 110px;display:flex;justify-content:center;overflow:hidden}
.f2{max-width:500px;width:100%;padding:62px clamp(26px,6vw,56px) 60px;opacity:0;transform:translateY(24px);transition:1s;text-align:center}
.f2.show{opacity:1;transform:none}
.f2 .en{font-size:18px;font-weight:700;color:var(--blue);text-transform:uppercase}
.f2 h2,.f2 p{font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif}
.f2 h2{font-weight:500;font-size:clamp(16px,2.6vw,19px);letter-spacing:.16em;margin:10px 0 24px;color:var(--blue)}
.f2 p{font-weight:400;font-size:12.5px;line-height:2.2;letter-spacing:.1em}
.f2 p+p{margin-top:1.1em}
footer{text-align:center;padding-bottom:40px;font-size:13px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#fff;color:var(--ink);border:1px solid var(--blue);padding:10px 20px;font-size:13px;letter-spacing:.1em;opacity:0;pointer-events:none;transition:.4s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== animations ===== */
.script{background:linear-gradient(100deg,#00629f 0%,#00629f 40%,#6fb6e6 50%,#00629f 60%,#00629f 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:write 2.6s cubic-bezier(.6,.1,.2,1) .3s both,shine 6s ease-in-out 3s infinite;padding:0 .15em .1em}
@keyframes write{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% -5% -10% 0)}}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-1.5deg)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.date{animation:up 1s ease 2.3s both}
.f1{animation:pop 1.2s cubic-bezier(.2,.8,.2,1) 2.7s both}
.w,.b{animation:drop .6s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(3.2s + var(--i)*.07s)}
.title{animation:up 1s ease 4.2s both}
.hint{animation:up 1s ease 4.5s both,blink 2.6s ease-in-out 5.5s infinite}
@keyframes blink{50%{opacity:.35}}
.deco{animation:drift 14s ease-in-out infinite alternate}
.deco:nth-of-type(2){animation-duration:18s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(18px,-16px) rotate(3deg)}}
.f1>svg,.f2>svg{transform-origin:center;animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.015) rotate(.3deg)}}
.f2 .en,.f2 h2,.f2 p{opacity:0}
.f2.show .en,.f2.show h2,.f2.show p{animation:up 1s ease both}
.f2.show h2{animation-delay:.25s}
.f2.show p:nth-of-type(1){animation-delay:.6s}.f2.show p:nth-of-type(2){animation-delay:1s}
.f2.show p:nth-of-type(3){animation-delay:1.4s}.f2.show p:nth-of-type(4){animation-delay:1.8s}.f2.show p:nth-of-type(5){animation-delay:2.2s}
.rise{position:fixed;z-index:9;pointer-events:none;color:var(--blue);font-size:26px;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{opacity:.9;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),-120px) rotate(25deg) scale(1.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.f2 .en,.f2 h2,.f2 p{opacity:1}.f2{opacity:1;transform:none}}

/* ===== ヌオー親子 ===== */
.mascot{display:flex;justify-content:center;padding:0 16px 10px;position:relative;z-index:1}
.mascot svg{width:clamp(250px,44vw,400px);height:auto;overflow:visible}
.q-all{animation:qsway 6s ease-in-out infinite;transform-origin:200px 390px}
.q-body{animation:qbreath 4s ease-in-out infinite;transform-origin:200px 385px}
.q-tail{animation:qtail 3s ease-in-out infinite;transform-origin:150px 365px}
.q-w1{animation:wbob 2.6s ease-in-out infinite;transform-origin:200px 85px}
.q-w2{animation:wbob 3s ease-in-out -1s infinite;transform-origin:150px 260px}
.q-w3{animation:wbob 2.8s ease-in-out -.4s infinite;transform-origin:268px 260px}
.q-mouth{animation:qtalk 2.4s ease-in-out infinite;transform-origin:200px 182px}
.q-eyes{animation:qblink 5s infinite;transform-origin:200px 150px}
.q-shadow{animation:qshadow 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.q-flower{animation:qfl 3.5s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box}
@keyframes qbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
@keyframes qsway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes qtail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes wbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes qtalk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07)}}
@keyframes qblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.2)}}
@keyframes qshadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
@keyframes qfl{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.q-bubble{animation:qpop 3.4s ease-in-out infinite;transform-origin:284px 96px}
@keyframes qpop{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.05) rotate(1.5deg)}}
.q-bubble text{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;letter-spacing:.08em}
/* ===== 画像のヌオー ===== */
.qstage{position:relative;width:clamp(190px,32vw,290px);padding-top:56px}
.qstage svg{width:100%}
.qimg{position:relative;transform-origin:50% 100%;animation:qi-breath 3.6s ease-in-out infinite,qi-hop 7s ease-in-out infinite}
.qimg img{display:block;width:100%;height:auto;animation:qi-sway 5s ease-in-out infinite;transform-origin:50% 100%}
.qb{position:absolute;width:4.4%;aspect-ratio:1;border-radius:50%;background:#affaff;border-bottom:2px solid #3e4a4f;opacity:0;transform:translate(-50%,-50%);animation:qi-blink 5s infinite}
.qb.l{left:17.6%;top:20.5%}.qb.r{left:53.9%;top:21.1%}
@keyframes qi-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.035)}}
@keyframes qi-sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes qi-hop{0%,86%,100%{translate:0 0}90%{translate:0 -14px}94%{translate:0 0}97%{translate:0 -6px}}
@keyframes qi-blink{0%,93%,100%{opacity:0}95%,97%{opacity:1}}
/* ===== ピアノの上から顔を出すヌオー ===== */
.f1{margin-top:80px}
.peek{--w:clamp(104px,18vw,150px);position:absolute;z-index:0;left:50%;width:var(--w);top:calc(70px - var(--w)*.62);transform:translateX(-50%);animation:peekin 1.1s cubic-bezier(.2,1.4,.4,1) 4.6s backwards}
.peek svg{width:100%}
.piano{z-index:2}
@keyframes peekin{from{transform:translate(-50%,calc(var(--w)*.7))}to{transform:translateX(-50%)}}
@keyframes qi-hop{0%,84%,100%{translate:0 0}88%{translate:0 calc(var(--w)*.28)}93%{translate:0 calc(var(--w)*-.06)}97%{translate:0 0}}
/* ===== メッセージのところのヌメラ ===== */
.numera{position:absolute;right:clamp(22px,9%,70px);bottom:-24px;width:clamp(64px,11vw,92px);height:auto;z-index:2;transform-origin:50% 100%;animation:nm-squish 3.2s ease-in-out infinite,nm-crawl 9s ease-in-out infinite}
.numera.err{display:none}
@keyframes nm-squish{0%,100%{transform:scale(1,1) rotate(0)}25%{transform:scale(1.07,.93) rotate(-2deg)}50%{transform:scale(.95,1.07) rotate(0)}75%{transform:scale(1.05,.95) rotate(2deg)}}
@keyframes nm-crawl{0%,100%{translate:0 0}50%{translate:-26px 0}}
/* ===== スマホ：メッセージ部分をゆったり・小さく ===== */
.f2 p{text-wrap:pretty}
@media (max-width:600px){
  .card-sec{padding:40px 12px 110px}
  .f2{padding:78px 40px 76px}
  .f2 .en{font-size:18px}
  .f2 h2{font-size:17px;letter-spacing:.14em;margin:12px 0 30px}
  .f2 p{font-size:12.5px;line-height:2.4;letter-spacing:.08em}
  .f2 p+p{margin-top:1.7em}
  .numera{width:54px;bottom:-18px;right:20px}
}
/* ===== オープニング：封蝋のメッセージカード ===== */
body.pre{overflow:hidden;height:100vh}
html:has(body.pre){overflow:hidden}
body.pre .wrap,body.pre .wrap *,body.pre header{animation-play-state:paused!important}
body.opened .wrap{animation:siteIn 1.4s ease both}
@keyframes siteIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fff 0%,#eaf4fb 85%);transition:opacity 1.1s ease}
.intro.reveal{opacity:0;pointer-events:none}
.intro-in{display:flex;flex-direction:column;align-items:center}
.env{position:relative;width:min(84vw,400px);aspect-ratio:1.55;perspective:900px;filter:drop-shadow(0 18px 28px #00629f33);animation:envin 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes envin{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.env>*{position:absolute}
.env-back{inset:0;background:#e1eff9;border-radius:3px}
.env-card{left:6%;right:6%;top:8%;bottom:6%;background:#fff;border:1.5px solid #cfe0ec;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9%;gap:4px;z-index:2}
.ec-script{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(26px,7vw,36px);color:var(--blue);line-height:1.2;text-align:center}
.ec-sub{font-size:13px;color:var(--sub)}
.env-front{inset:0;background:linear-gradient(#f6fbff,#e9f4fb);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:3}
.env-flap{left:0;right:0;top:0;height:58%;background:#f1f8fd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:5}
.env-lines{inset:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible}
.env-lines path{fill:none;stroke:var(--blue);stroke-width:1.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.seal{left:50%;top:58%;width:clamp(56px,17%,70px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:7;border:0;cursor:pointer;border-radius:50% 46% 52% 48%/48% 53% 47% 51%;background:radial-gradient(circle at 35% 30%,#3a8fc7,#00629f 45%,#003f6b 100%);box-shadow:0 4px 8px #00294a66,inset 0 2px 3px #7cc0ea88,inset 0 -3px 5px #00294a99;color:#d5ebf9;font-size:26px;display:grid;place-items:center;animation:sealpulse 2.4s ease-in-out infinite}
.seal::before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid #8cc4e8aa;box-shadow:inset 0 1px 2px #00294a99,0 1px 1px #5fa9d655}
.seal::after{content:"";position:absolute;width:26%;aspect-ratio:1;right:-5%;bottom:3%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2f86c0,#00629f 60%,#003f6b);box-shadow:-34px 8px 0 -3px #00629f}
.seal span{position:relative;text-shadow:0 -1px 1px #00294a}
@keyframes sealpulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.intro-hint{margin-top:34px;color:var(--sub);font-size:13px;letter-spacing:.2em;text-align:center;animation:blink 2.6s ease-in-out 1.4s infinite;transition:opacity .3s}
.intro.open .intro-hint{opacity:0;animation:none}
.intro.open .seal{animation:sealbreak .6s ease-in forwards;pointer-events:none}
@keyframes sealbreak{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-50%) scale(1.2) rotate(-6deg)}100%{transform:translate(-50%,-25%) scale(.55) rotate(22deg);opacity:0}}
.intro.open .env-flap{animation:flapopen .8s ease-in-out .35s forwards}
@keyframes flapopen{0%{transform:rotateX(0);z-index:5;background:#f1f8fd}49%{transform:rotateX(-90deg);z-index:5;background:#f1f8fd}50%{z-index:1;background:#d3e6f3}100%{transform:rotateX(-180deg);z-index:1;background:#d3e6f3}}
.intro.open .env-card{animation:cardup .9s cubic-bezier(.3,.8,.3,1) 1s forwards}
@keyframes cardup{to{transform:translateY(-58%)}}
.intro.reveal .env-card{z-index:9;animation:cardbig 1.2s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes cardbig{from{transform:translateY(-58%) scale(1)}to{transform:translateY(-58%) scale(16)}}
.intro.reveal .env-card>*{opacity:0;transition:opacity .35s}
</style>
</head>
<body class="pre">
<div class="intro" id="intro">
  <div class="intro-in">
    <div class="env">
      <div class="env-back"></div>
      <div class="env-card"><div class="ec-script" id="i-title"></div><div class="ec-sub en" id="i-date"></div></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <svg class="env-lines" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 H100 V100 H0 Z M0 0 L50 58 L100 0"/></svg>
      <button class="seal" id="seal" aria-label="開く"><span>♪</span></button>
    </div>
    <div class="intro-hint" id="i-hint"></div>
  </div>
</div>
<header class="en">Birthday Present</header>
<canvas id="snow"></canvas>

<main class="wrap">
<div class="hero">
  <!-- 背景の線（一部だけ描いた図形） -->
  <svg class="deco" style="left:-4%;top:60%;width:32%;height:28%" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path class="ln" opacity=".4" d="M2,14 L98,0 M100,8 L92,62 M88,100 L10,86 M2,14 L5,50"/></svg>
  <svg class="deco" style="right:-3%;top:10%;width:26%;height:24%" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path class="ln" opacity=".35" d="M0,6 L60,2 M70,1.5 L94,0 M100,10 L99,88 M8,100 L50,96"/></svg>

  <div class="script" id="t-title"></div>
  <div class="date en" id="t-date"></div>

  <div class="frame f1">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon class="fl" points="0,9 98,0 100,92 5,100"/>
      <path class="ln" d="M-2,9.6 L100,-0.4 M100.2,3 L99.4,60 M99.8,76 L100.2,93 M8,100.4 L101,92.2 M0,9 L2.8,64"/>
    </svg>
    <div class="peek"><div class="qimg"><img id="q-photo" alt="ヌオー"><i class="qb l"></i><i class="qb r"></i></div>
    <div id="q-fallback" style="display:none" aria-hidden="true"><svg viewBox="0 0 400 430">
  <defs>
    <g id="wooper">
      <path fill="none" stroke="var(--gc)" stroke-width="3.5" stroke-linecap="round" d="M-22 -5 L-39 -13 M-22 -1 L-41 1 M-22 4 L-37 13 M22 -5 L39 -13 M22 -1 L41 1 M22 4 L37 13"/>
      <ellipse rx="24" ry="19" style="fill:var(--wc)" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="-9" cy="-5" r="2.5" fill="#4a3428"/><circle cx="9" cy="-5" r="2.5" fill="#4a3428"/>
      <path d="M-12 3 Q0 21 12 3 Z" fill="#ec8f86" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="200" cy="405" rx="195" ry="22" fill="#d6ecb0"/>
  <ellipse class="q-shadow" cx="205" cy="402" rx="120" ry="9" fill="#bcd98f" opacity=".7"/>
  <g class="q-flower"><path d="M42 392 v-14" stroke="#9cc26e" stroke-width="2"/><circle cx="42" cy="374" r="6" fill="#f4a7b4"/></g>
  <g class="q-flower"><path d="M360 396 v-16" stroke="#9cc26e" stroke-width="2"/><circle cx="360" cy="376" r="6" fill="#f9c7a0"/></g>
  <g class="q-all">
    <g class="q-tail">
      <path fill="#8fd0f0" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M158 330 C100 312 40 330 34 362 C34 392 110 392 170 372 Z"/>
      <path fill="none" stroke="#2f4f8f" stroke-width="9" stroke-linecap="round" d="M56 342 C86 326 126 328 152 344"/>
    </g>
    <g class="q-body">
      <path fill="#a9dcf2" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M200 66 C150 66 125 112 122 158 C100 198 95 290 120 346 C145 388 255 388 280 346 C305 290 300 198 278 158 C275 112 250 66 200 66 Z"/>
      <path fill="#b79be4" d="M126 222 C112 262 118 312 136 342 C152 300 146 250 126 222 Z"/>
      <g class="q-eyes"><path fill="none" stroke="#4a3428" stroke-width="3.2" stroke-linecap="round" d="M160 152 Q169 142 178 152 M222 152 Q231 142 240 152"/></g>
      <circle cx="154" cy="172" r="11" fill="#f4a7b4" opacity=".45"/><circle cx="248" cy="172" r="11" fill="#f4a7b4" opacity=".45"/>
      <circle cx="195" cy="168" r="1.6" fill="#7a5a48"/><circle cx="206" cy="168" r="1.6" fill="#7a5a48"/>
      <g class="q-mouth"><path fill="#ec8f86" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" d="M156 180 Q200 200 246 178 Q238 226 200 228 Q164 226 156 180 Z"/><ellipse cx="208" cy="216" rx="20" ry="7" fill="#f6aaa0"/></g>
      <g class="q-w1"><use href="#wooper" x="200" y="46" style="--wc:#c3ecf7;--gc:#b48fe0"/></g>
      <g class="q-w2"><use href="#wooper" x="150" y="248" style="--wc:#c3ecf7;--gc:#b48fe0"/></g>
      <g class="q-w3"><use href="#wooper" x="268" y="252" style="--wc:#f8bdd3;--gc:#f0a58a"/></g>
      <ellipse cx="160" cy="290" rx="44" ry="21" fill="#b4e2f4" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <ellipse cx="256" cy="294" rx="44" ry="21" fill="#b4e2f4" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <ellipse cx="148" cy="366" rx="32" ry="26" fill="#cdeef8" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <ellipse cx="254" cy="366" rx="32" ry="26" fill="#cdeef8" stroke="#7a5a48" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

<section class="card-sec">
  <div class="frame f2" id="card">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon class="fl" points="3,0 100,6 96,100 0,92"/>
      <path class="ln" d="M-1,-0.2 L58,3.3 M67,3.9 L101,6.2 M100.2,5 L96.6,100.4 M-1,91.8 L96,100.4 M3,-2 L0.6,68"/>
    </svg>
    <div class="en">Message</div>
    <h2>21歳のお誕生日おめでとう</h2>
    <p>今回ピアノでカバーした曲「生命（いのち）の奇跡」は元々、英国の少年合唱団リベラ（Libera）の曲で「すべてが生命の奇跡の中に」という意味が込められています。</p>
    <p>るなが生まれてきてくれて、自分と今こうして一緒にいてくれることに感謝してこの曲を選びました。</p>
    <p>自分が作る音色が大好きだって言ってくれたことがすごく嬉しくて、るなに聴かせるようになってからピアノがもっと好きになりました。</p>
    <p>いつまでも好きって言ってもらえるように頑張ります。</p>
    <p>これからもよろしくね。</p>

</main>
<footer class="en">Happy Birthday Runa</footer>
<div id="toast"></div>

<script>
/* ============================================================
   ★ ここだけ編集すればOK ★
   ============================================================ */
var CONFIG = {
  TITLE:        "Happy Birthday Runa",            // 一番上の筆記体の文字
  SUBTITLE:     "生命の奇跡 Birthday Ver.",        // 鍵盤の下の文字
  GUIDANCE:     "（鍵盤クリックしてみて）",         // その下の文字
  DATE:         "2026/11/15",
  INTRO_HINT:   "（封蝋をクリックして開く）",        // オープニングの案内文                     // タイトルの下の日付
  OP_AUDIO:     "./OP.mp3",                       // ★封蝋を開いたときに流す音源（このHTMLと同じフォルダに置く）
  OP_DELAY:     2700,                             // ★音が鳴り始めるまでの遅れ（ミリ秒。1000＝1秒。0なら封蝋を押してすぐ）
  NUMERA_IMAGE: "./numera.png",                   // メッセージ下の小さなヌメラ画像（このHTMLと同じフォルダに置く）
  MASCOT_IMAGE: "./quagsire.png",                  // ヌオー画像のパス（このHTMLと同じフォルダに置く）。読み込めない時は描いたイラストを表示
  AUDIO_FILE:   "./song of life (Libera).mp3",    // ★音源ファイルのパス（このHTMLと同じフォルダに置く）
  AUDIO_NAME:   "song of life (Libera).mp3",      // ★ダウンロード時に付くファイル名
};
document.getElementById("t-title").textContent=CONFIG.TITLE;
document.getElementById("t-date").textContent=CONFIG.DATE;
document.getElementById("t-sub").textContent=CONFIG.SUBTITLE;
document.getElementById("t-guide").textContent=CONFIG.GUIDANCE;
document.title=CONFIG.TITLE;
document.getElementById("i-title").textContent=CONFIG.TITLE;
document.getElementById("i-date").textContent=CONFIG.DATE;
document.getElementById("i-hint").textContent=CONFIG.INTRO_HINT;
(function(){const intro=document.getElementById("intro"),seal=document.getElementById("seal");
  function openIt(){if(intro.classList.contains("open"))return;intro.classList.add("open");
    try{window.__op=new Audio(encodeURI(CONFIG.OP_AUDIO||"./OP.mp3"));window.__op.preload="auto";setTimeout(()=>{window.__op.play().catch(()=>{})},CONFIG.OP_DELAY||0)}catch(e){}
    setTimeout(()=>intro.classList.add("reveal"),2150);
    setTimeout(()=>{document.body.classList.remove("pre");document.body.classList.add("opened")},2350);
    setTimeout(()=>intro.remove(),3700)}
  seal.addEventListener("click",openIt);intro.querySelector(".env").addEventListener("click",openIt);})();
(function(){const n=document.getElementById("numera");n.onerror=()=>n.classList.add("err");n.src=encodeURI(CONFIG.NUMERA_IMAGE||"./numera.png");})();
(function(){const im=document.getElementById("q-photo");
  im.onerror=()=>{document.querySelector(".qimg").style.display="none";document.getElementById("q-fallback").style.display="block"};
  im.src=encodeURI(CONFIG.MASCOT_IMAGE||"./quagsire.png");})();

const NOTES=[{f:"C",w:1},{f:"Cs"},{f:"D",w:1},{f:"Ds"},{f:"E",w:1},{f:"F",w:1},{f:"Fs"},{f:"G",w:1},{f:"Gs"},{f:"A",w:1},{f:"As"},{f:"B",w:1}];
const FREQ={C:261.63,Cs:277.18,D:293.66,Ds:311.13,E:329.63,F:349.23,Fs:369.99,G:392,Gs:415.3,A:440,As:466.16,B:493.88};
const piano=document.getElementById("piano"),toast=document.getElementById("toast");let ctx,wi=0,tt;
function tone(n){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.value=FREQ[n];g.gain.setValueAtTime(.25,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.2);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.2)}catch(e){}}
function say(t){toast.textContent=t;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),2400)}
function download(){
  const a=document.createElement("a");
  a.href=encodeURI(CONFIG.AUDIO_FILE);a.download=CONFIG.AUDIO_NAME;
  document.body.appendChild(a);a.click();a.remove();
  say("ダウンロードします ♪");
}
NOTES.forEach(n=>{const a=document.createElement("a");a.style.setProperty("--i",NOTES.indexOf(n));a.setAttribute("role","button");a.tabIndex=0;
const go=e=>{tone(n.f);burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2);a.classList.add("on");setTimeout(()=>a.classList.remove("on"),200);download()};
a.addEventListener("click",go);a.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(e)}});
if(n.w){a.className="w";a.setAttribute("aria-label",n.f);piano.appendChild(a);wi++}else{a.className="b";a.dataset.after=wi;a.setAttribute("aria-label",n.f.replace("s","#"));piano.appendChild(a)}});
function burst(x,y){for(let i=0;i<3;i++){const r=document.createElement("span");r.className="rise";r.textContent=["♪","♫","♬","♩"][Math.random()*4|0];r.style.left=(x-8+Math.random()*16)+"px";r.style.top=y+"px";r.style.setProperty("--dx",(Math.random()*80-40)+"px");r.style.animationDelay=(i*.12)+"s";document.body.appendChild(r);setTimeout(()=>r.remove(),2000)}}
function layout(){const w=piano.querySelector(".w"),b=piano.querySelector(".b");const ww=w.getBoundingClientRect().width,bw=b.getBoundingClientRect().width;piano.querySelectorAll(".b").forEach(x=>{x.style.left=(12+ww*x.dataset.after-bw/2)+"px"})}
addEventListener("resize",layout);layout();
new IntersectionObserver((e,o)=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("show");o.unobserve(x.target)}}),{threshold:.15}).observe(document.getElementById("card"));

// 小さな雪の結晶
const cv=document.getElementById("snow"),c=cv.getContext("2d");let W,H,flakes=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener("resize",rs);
for(let i=0;i<55;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*3.5,v:.35+Math.random()*.8,d:Math.random()*6,a:Math.random()*6,s:(Math.random()-.5)*.02});
function flake(f){c.save();c.translate(f.x,f.y);c.rotate(f.a);c.strokeStyle="rgba(120,175,215,.85)";c.lineWidth=1;c.beginPath();
for(let k=0;k<3;k++){const t=k*Math.PI/3,dx=Math.cos(t)*f.r,dy=Math.sin(t)*f.r;c.moveTo(-dx,-dy);c.lineTo(dx,dy)}c.stroke();c.restore()}
(function loop(){c.clearRect(0,0,W,H);flakes.forEach(f=>{f.y+=f.v;f.d+=.015;f.x+=Math.sin(f.d)*.4;f.a+=f.s;if(f.y>H+8){f.y=-8;f.x=Math.random()*W}flake(f)});requestAnimationFrame(loop)})();
</script>
</body>
