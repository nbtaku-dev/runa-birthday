<style>
:root{
  color-scheme:light;
  --ink:#241f2b; --gold:#bfa070; --gold2:#e6d3ae; --maple:#a23a1b; --sub:#a8885a;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sans:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --cw:clamp(290px,min(25vw,57vh),470px);
  --vt-left:calc(50% + var(--cw)*.6 + 2vw);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#fff;color:var(--ink);font-family:var(--sans);animation:fadein 1.6s var(--ease) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes appear{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
@keyframes ch{to{opacity:1;filter:none;transform:none}}
@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 7px))}}
@keyframes kin{to{opacity:1}}
@keyframes glint{0%,14%,100%{box-shadow:inset 0 -16px 20px rgba(230,211,174,0)}7%{box-shadow:inset 0 -16px 20px rgba(230,211,174,.6)}}

.stage{position:fixed;inset:0;overflow:hidden;z-index:1}
.in{opacity:0;animation:appear 1.8s var(--ease) var(--dl,0s) forwards}

/* header / footer chrome */
.logo{position:absolute;z-index:6;left:2%;top:calc(env(safe-area-inset-top,0px) + 1.6vh);margin:0;
  font-weight:700;font-size:clamp(30px,3.5vw,60px);letter-spacing:-.02em;line-height:1.1}
.chips{position:absolute;z-index:6;right:2.2%;top:calc(env(safe-area-inset-top,0px) + 3vh);display:flex;gap:.4em;
  font-weight:700;font-size:clamp(11px,1.05vw,16px);line-height:1}
.chips span{padding:.55em 1.1em;border-radius:99px}
.chips .on{background:var(--ink);color:#fff}
.foot{position:absolute;z-index:6;right:2.2%;bottom:3.4vh;display:flex;gap:2.2vw;align-items:baseline;font-size:clamp(11px,.95vw,14px)}
.foot b{font-weight:700}.foot small{color:#c6c1ca;font-size:.8em}

/* tilted cards */
.card{position:absolute;border-radius:clamp(22px,2.6vw,44px);transform:rotate(-8deg);box-shadow:0 30px 70px rgba(200,160,130,.16)}
.c-grey{background:#eeecee;box-shadow:none}
.c-g1{left:36%;top:-14%;width:22%;height:24vh;z-index:1}
.c-g2{left:43%;bottom:-13vh;width:20%;height:22vh;z-index:1;background:#ebe9ea}
.c-left{left:-4%;top:5%;width:22%;height:70%;z-index:1;overflow:hidden;background:linear-gradient(160deg,#fff3e2,#fde0c4)}
.c-red{left:3.5%;bottom:-6%;width:26%;height:28%;z-index:1;overflow:hidden;background:linear-gradient(135deg,#ff5f2d,#e23a1c)}
.lf{position:absolute;fill:currentColor;stroke:currentColor;stroke-width:.07;stroke-linejoin:round;stroke-linecap:round;overflow:visible;transform:rotate(var(--r,0deg))}

/* floating circles */
.dot{position:absolute;z-index:2;width:var(--d);height:var(--d);border-radius:50%;overflow:hidden;
  transform:translate(-50%,-50%);box-shadow:0 38px 60px -18px var(--sh)}
.dot.in{animation:appear 1.8s var(--ease) var(--dl,0s) forwards, float 9s ease-in-out calc(var(--dl,0s) + 2s) infinite}
.d1{left:34%;top:18%;--d:clamp(90px,11.6vw,230px);--sh:rgba(240,150,90,.45);background:radial-gradient(circle at 35% 30%,#fff1e0,#f9c59b 75%)}
.d2{left:27%;top:62%;--d:clamp(60px,7.6vw,150px);--sh:rgba(230,190,90,.45);background:radial-gradient(circle at 35% 30%,#fff8e4,#f3dd9c 80%)}
.d3{left:77%;top:76%;--d:clamp(130px,15.2vw,300px);--sh:rgba(235,150,160,.4);background:radial-gradient(circle at 35% 25%,#fffafa,#f8dcdc 85%)}
.dot .lf{width:66%;left:17%;top:16%}
.script{margin:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;
  font-family:"Great Vibes","Snell Roundhand","Apple Chancery","Brush Script MT",cursive;color:var(--sub);transform:translateY(8px);}
.script span{font-size:calc(var(--d)*.12)}
.script b{font-weight:400;font-size:calc(var(--d)*.25);margin-top:.05em}

/* center card with piano */
.c-center{left:50%;top:50%;z-index:3;width:var(--cw);aspect-ratio:3/4;transform:translate(-50%,-50%) rotate(-8deg);
  container-type:inline-size;background:linear-gradient(165deg,#fbf4e2,#f4e8cc);box-shadow:0 40px 80px rgba(200,160,110,.22)}
.c-center::before{content:"";position:absolute;inset:3cqw;border:1px solid var(--gold);border-radius:calc(clamp(22px,2.6vw,44px) - 3cqw);pointer-events:none;opacity:.7}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6cqw}
.kb{position:relative;display:flex;width:78cqw;height:34cqw;border-top:3px solid var(--gold);border-radius:3px 3px 0 0}
.wk{flex:1;position:relative;padding:0;margin:0 0 0 -1px;cursor:pointer;
  border:1px solid var(--gold2);border-top:none;border-radius:0 0 7px 7px;
  background:linear-gradient(#fff 0%,#faf6f3 80%,#efe7e2 100%);
  opacity:0;animation:kin 1.4s var(--ease) forwards, glint 8s ease-in-out infinite;
  animation-delay:calc(var(--k)*90ms + 2.6s), calc(var(--k)*160ms + 5.5s);
  transition:background .25s,transform .15s;-webkit-tap-highlight-color:transparent}
.wk:first-child{margin-left:0}
.bk{position:absolute;top:0;width:8.57%;height:62%;left:calc(var(--p)*14.2857% - 4.2857%);z-index:2;
  padding:0;border:0;border-radius:0 0 5px 5px;cursor:pointer;
  background:linear-gradient(#5e5666,#2f2a35);box-shadow:0 3px 6px rgba(60,50,70,.3);
  opacity:0;animation:kin 1.4s var(--ease) forwards;animation-delay:calc(var(--p)*90ms + 3s);
  transition:background .25s,transform .15s;-webkit-tap-highlight-color:transparent}
.wk.down{background:linear-gradient(#f3e3d8,#ecdccd);transform:translateY(2px)}
.bk.down{background:linear-gradient(#4a4252,#26212b);transform:translateY(1.5px)}
.wk:focus-visible,.bk:focus-visible,.go:focus-visible{outline:2px solid var(--gold);outline-offset:3px;z-index:3}
#lab{margin:0;min-height:1.6em;max-width:88cqw;text-align:center;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:max(11px,4.2cqw);letter-spacing:.12em;color:var(--sub);transition:opacity .3s}
#lab .ch{--d:4.8s}

/* 追加した文字のアニメーション用スタイル（少し遅れて表示） */
#sub-guidance{margin:0;min-height:1.4em;max-width:88cqw;text-align:center;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:max(9.5px,3.0cqw);letter-spacing:.08em;color:#c29c66;}
#sub-guidance .ch{--d:5.4s}

.go{position:absolute;z-index:4;right:-8.5cqw;top:50%;width:17cqw;aspect-ratio:1;padding:0;border:0;border-radius:50%;cursor:pointer;
  background:var(--maple);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 28px rgba(162,58,27,.35);transform:translateY(-50%) rotate(8deg);
  transition:transform .4s var(--ease);-webkit-tap-highlight-color:transparent}
.go svg{width:42%;height:42%}
.go:hover{transform:translateY(-50%) rotate(8deg) scale(1.07)}
.go.down{transform:translateY(-50%) rotate(8deg) scale(.94)}

/* vertical title */
.vt{position:absolute;z-index:3;left:var(--vt-left);top:50%;transform:translateY(-50%);writing-mode:vertical-rl;display:block}
.vt h1{margin:0;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;
  font-size:clamp(20px,min(2.5vw,4.4vh),44px);letter-spacing:.12em;line-height:1.3;text-shadow:0 0 10px #fff}
.vt p{margin:.2em 1em 0 0;font-weight:500;font-size:clamp(9px,.8vw,12px);letter-spacing:.3em;color:#b8b3bd}
.ch{display:inline-block;opacity:0;filter:blur(5px);transform:translateY(6px);
  animation:ch 1.8s var(--ease) forwards;animation-delay:calc(var(--i)*110ms + var(--d))}
.vt h1 .ch{--d:3s}
#dt .ch{--d:5s}

/* leaves */
#fx{position:fixed;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;opacity:0;animation:fadein 3s var(--ease) 1s forwards}

@media (max-aspect-ratio:1/1){
  :root{--cw:clamp(230px,64vw,340px);--vt-left:calc(5vw + var(--cw)*1.1 + 2vw)}
  .logo{font-size:clamp(28px,8vw,44px)}
  .chips{font-size:11px}
  .c-center{left:calc(5vw + var(--cw)/2);top:49%}
  .vt{top:49%}
  .vt h1{font-size:clamp(17px,min(5vw,3.6vh),26px)}
  .c-left{display:none}
  .c-g1{left:46vw;top:-9vh;width:50vw;height:19vh}
  .c-g2{left:50vw;bottom:-9vh;width:46vw;height:19vh}
  .c-red{left:-12vw;bottom:-6vh;width:58vw;height:25vh}
  .d1{left:78%;top:15%;--d:26vw}
  .d2{left:18%;top:16%;--d:17vw}
  .d3{left:74%;top:86%;--d:38vw}
  .foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .in,.wk,.bk{opacity:1;filter:none}
  .ch{opacity:1;filter:none;transform:none}
  #fx{display:none}
}
</style>
</head>

<!-- ============================================================
     ★ 設定（ここだけ書き換えればOK）
     ★ 音源を差し替える／追加するときは AUDIO_FILE と AUDIO_NAME を変更
     ============================================================ -->
<script>
var CONFIG = {
  TITLE:        "るな誕生日おめでとう！",      // 上の文字
  SUBTITLE:     "生命の奇跡Birthday Ver.",         // 鍵盤の下の文字
  GUIDANCE:     "（鍵盤クリックしてみて）",    // 追加した文字
  DATE:         "2026/11/15",                     // タイトルの下の日付
  AUDIO_FILE:   "./グット・ドクター(アレンジ).m4a",                  // ★音源ファイルのパス（このHTMLと同じフォルダに置く）
  AUDIO_NAME:   "グット・ドクター(アレンジ).m4a",                  // ★ダウンロード時に付くファイル名
};
</script>

<script>
(function(){
  var C = CONFIG, R = Math.random;

  /* ---------- text ---------- */
  function split(id, text){
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = ""; el.setAttribute("aria-label", text);
    Array.from(text).forEach(function(ch, i){
      var s = document.createElement("span");
      s.className = "ch"; s.style.setProperty("--i", i);
      s.setAttribute("aria-hidden", "true"); s.textContent = ch;
      el.appendChild(s);
    });
  }
  split("t1", C.TITLE); split("dt", C.DATE); split("lab", C.SUBTITLE); split("sub-guidance", C.GUIDANCE);
  document.title = C.TITLE;

  /* ---------- piano keys ---------- */
  var kb = document.getElementById("kb"), lab = document.getElementById("lab"), tm, lastDl = 0, ac;

  function tone(f){
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var n = ac.currentTime, g = ac.createGain();
      g.gain.setValueAtTime(.0001, n);
      g.gain.exponentialRampToValueAtTime(.12, n + .01);
      g.gain.exponentialRampToValueAtTime(.0001, n + 1.6);
      g.connect(ac.destination);
      [["triangle", f, 1], ["sine", f*2, .35]].forEach(function(p){
        var o = ac.createOscillator(), v = ac.createGain();
        o.type = p[0]; o.frequency.value = p[1]; v.gain.value = p[2];
        o.connect(v); v.connect(g); o.start(n); o.stop(n + 1.7);
      });
    }catch(e){}
  }
  function say(msg){
    clearTimeout(tm); lab.style.opacity = 0;
    setTimeout(function(){ lab.textContent = msg; lab.style.opacity = 1; }, 300);
    tm = setTimeout(function(){
      lab.style.opacity = 0;
      setTimeout(function(){ lab.textContent = C.SUBTITLE; lab.style.opacity = 1; }, 300);
    }, 3600);
  }
  function press(b){
    tone(+b.dataset.f); b.classList.add("down");
    var now = Date.now(); if (now - lastDl < 4000) return; lastDl = now;    // 連打でも4秒に1回だけ保存
    if (!C.AUDIO_FILE) { say("音源ファイルが未設定です"); return; }
    var a = document.createElement("a");
    a.href = C.AUDIO_FILE; a.download = C.AUDIO_NAME || "";
    document.body.appendChild(a); a.click(); a.remove();
    say("ダウンロードを開始しました");
  }
  function releaseAll(){ kb.querySelectorAll(".down").forEach(function(b){ b.classList.remove("down"); }); }
  kb.addEventListener("pointerdown", function(e){ var b = e.target.closest("button"); if (b) { e.preventDefault(); press(b); } });
  kb.addEventListener("keydown", function(e){
    var b = e.target.closest("button");
    if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (!e.repeat) press(b); }
  });
  kb.addEventListener("keyup", releaseAll);
  kb.addEventListener("click", function(e){ e.preventDefault(); });
  var go = document.getElementById("go");
  go.addEventListener("click", function(){ press(go); setTimeout(function(){ go.classList.remove("down"); }, 220); });
  document.addEventListener("pointerup", releaseAll);
  document.addEventListener("pointercancel", releaseAll);

  /* ---------- autumn leaves (depth layers) ---------- */
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  var W, H, leaves = [], last = 0;

  function sprite(c1, c2){
    var S = 64, c = document.createElement("canvas"); c.width = c.height = S;
    var g = c.getContext("2d");
    var pts = [[0,1],[30,.5],[58,.95],[88,.46],[115,.76],[146,.4],[180,.28]], poly = [];
    pts.forEach(function(p){ var a = p[0]*Math.PI/180; poly.push([p[1]*Math.sin(a), -p[1]*Math.cos(a)]); });
    for (var i = pts.length - 2; i > 0; i--) poly.push([-poly[i][0], poly[i][1]]);
    g.translate(S/2, S/2); g.scale(S*.46, S*.46); g.translate(0, .36);
    g.beginPath();
    poly.forEach(function(p, i){ i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
    g.closePath();
    var gr = g.createRadialGradient(0, -.2, .05, 0, -.2, 1.5);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    g.fillStyle = gr; g.fill();
    g.strokeStyle = "rgba(255,235,200,.45)"; g.lineWidth = .025;
    g.beginPath();
    [[0,.9],[58,.8],[-58,.8],[115,.6],[-115,.6]].forEach(function(v){
      var a = v[0]*Math.PI/180; g.moveTo(0, .14); g.lineTo(v[1]*Math.sin(a), -v[1]*Math.cos(a));
    });
    g.stroke();
    g.strokeStyle = c2; g.lineWidth = .06;
    g.beginPath(); g.moveTo(0, .28); g.lineTo(0, .55); g.stroke();
    return c;
  }
  var spr = [
    sprite("#ee5240", "#a8231a"), sprite("#f48a35", "#b84a14"), sprite("#f6bd45", "#c07d12"),
    sprite("#d4402f", "#7e1d14"), sprite("#e86d2c", "#9a3a14")
  ];

  function size(){
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*d; cv.height = H*d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  size(); addEventListener("resize", size);

  // d: 0 = far, 1 = near  -> smaller, slower, fainter when far
  function mk(init){
    var d = R();
    return {
      x: R()*W, y: init ? R()*H - H*.1 : -30 - R()*H*.4, d: d,
      s: 9 + d*20, v: (.25 + d*.6)*(.8 + R()*.4), a: .2 + d*.42,
      ph: R()*6.28, sw: .25 + d*.5, rot: R()*6.28, vr: (R() - .5)*.03,
      fl: R()*6.28, fv: .02 + R()*.03, img: spr[(R()*spr.length)|0]
    };
  }
  var N = Math.max(45, Math.min(170, Math.round(W/7)));
  for (var k = 0; k < N; k++) leaves.push(mk(true));

  function tick(t){
    var ms = Math.min(100, t - last || 16.7); last = t;
    var dt = ms/16.7;
    ctx.clearRect(0, 0, W, H);

    // leaves: far layer first, then near layer
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < leaves.length; i++) {
        var L = leaves[i];
        if ((L.d >= .5 ? 1 : 0) !== pass) continue;
        L.y += L.v*dt;
        L.x += (Math.sin(t/1400 + L.ph)*L.sw*.9 + .1 + L.d*.1)*dt;
        L.rot += L.vr*dt; L.fl += L.fv*dt;
        if (L.x > W + 20) L.x = -20; else if (L.x < -20) L.x = W + 20;
        if (L.y - L.s > H) { leaves[i] = mk(false); continue; }
        ctx.save(); ctx.globalAlpha = L.a;
        ctx.translate(L.x, L.y); ctx.rotate(L.rot);
        ctx.scale(.35 + .65*Math.abs(Math.cos(L.fl)), 1);
        ctx.drawImage(L.img, -L.s/2, -L.s/2, L.s, L.s); ctx.restore();
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
